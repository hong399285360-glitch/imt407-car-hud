# CMSIS DAP (启明欣欣F407轻奢版V3.1标配仿真器)
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 4000

source [find target/stm32f4x.cfg]

# 板子只引出 SWDIO/SWCLK/GND/VCC, 没有独立 SRST 线, 所以不用 srst:
# none 让 OpenOCD 走内核软复位 (SYSRESETREQ), 烧录后 reset run 仍能正常复位运行。
# 若你的 CMSIS-DAP 确实接了 nRESET 且需要硬复位, 改回:
#   reset_config srst_only srst_nogate
reset_config none
